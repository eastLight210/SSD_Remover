name: SSD_Remover
options:
  bundleIdPrefix: com.honeybadger210
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.2"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  SSD_Remover:
    type: application
    platform: macOS
    sources:
      - path: SSD_Remover
        excludes:
          - "**/*.entitlements"
          - "**/Info.plist"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honeybadger210.SSD-Remover
        CODE_SIGN_ENTITLEMENTS: SSD_Remover/SSD_Remover.entitlements
        ENABLE_APP_SANDBOX: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SSD_Remover/Resources/Info.plist
      properties:
        CFBundleDisplayName: SSD Remover
        # Versions live here; `xcodegen generate` rewrites Info.plist from these properties.
        CFBundleShortVersionString: "1.2.2"
        CFBundleVersion: "5"
        LSUIElement: true
        # Sparkle: the latest GitHub release carries appcast.xml (see script/release.sh).
        SUFeedURL: https://github.com/eastLight210/SSD_Remover/releases/latest/download/appcast.xml
        SUPublicEDKey: "LBPIZAYTsZSiAi9dd8axws+GWchPvO5oPWP8M9J940g="
        SUEnableAutomaticChecks: true

  SSD_RemoverTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SSD_RemoverTests
    dependencies:
      - target: SSD_Remover
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.honeybadger210.SSD-RemoverTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SSD_Remover.app/Contents/MacOS/SSD_Remover"
        BUNDLE_LOADER: "$(TEST_HOST)"
